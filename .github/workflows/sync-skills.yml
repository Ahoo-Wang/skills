# Mirror upstream skills into plugins/ and regenerate the marketplaces.
# 从源仓库同步 skills 并重新生成 marketplace
name: Sync Skills

on:
  schedule:
    # Every 6 hours at :17 (02:17, 08:17, 14:17, 20:17 UTC); the top of the
    # hour is GitHub's busiest slot and scheduled runs there are delayed for hours.
    - cron: '17 2,8,14,20 * * *'
  # Run manually when an upstream change should ship before the next schedule:
  #   gh workflow run sync-skills.yml --repo Ahoo-Wang/skills
  workflow_dispatch:

permissions:
  contents: write
  # To start the Pages deployment after a sync commit (see below).
  actions: write

# One sync at a time. A run that starts while another is in flight waits, and
# GitHub keeps only the newest pending run, which syncs the latest upstreams.
concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout skills repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Nothing on disk changes unless every source syncs. When only upstream
      # commits moved, the lock is kept and the worktree stays clean.
      - name: Sync skills from source repos
        run: node scripts/skills.mjs sync

      - name: Check the result
        run: node scripts/skills.mjs check

      - name: Commit, push and redeploy the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync skills from source repos [skip ci]"
          # main may have moved during the sync (for example a merged PR).
          # Rebase once and retry; a conflict fails the run and the next sync
          # regenerates from the new main.
          if ! git push; then
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
          # Pushes made with GITHUB_TOKEN do not start other workflows, and the
          # site pages are generated from the synced skills, so deploy explicitly.
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
